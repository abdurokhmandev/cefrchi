<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CEFRchi Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a;
            --sidebar: #1e293b; --card: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1); --text: #f8fafc; --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px; position: fixed; height: 100vh; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }
        .nav-link { display: flex; align-items: center; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 5px; transition: 0.3s; font-size: 14px; }
        .nav-link:hover, .nav-link.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
        .main-content { margin-left: 260px; flex: 1; padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-muted); font-size: 12px; padding-bottom: 10px; }
        td { padding: 12px 0; border-top: 1px solid var(--border); font-size: 13px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .hidden { display: none !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        textarea, input, select { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="loader"><div style="width:30px; height:30px; border:3px solid #334155; border-top-color:#6366f1; border-radius:50%; animation:spin 1s linear infinite;"></div></div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div class="sidebar">
        <div class="logo">CEFRchi Admin</div>
        <div class="nav-menu">
            <a href="#" class="nav-link active" onclick="showTab('dashboard', this)">Dashboard</a>
            <a href="#" class="nav-link" onclick="showTab('users', this)">Foydalanuvchilar</a>
            <a href="#" class="nav-link" onclick="showTab('topics', this)">Topiklar</a>
            <a href="#" class="nav-link" onclick="showTab('broadcast', this)">Xabar yuborish</a>
        </div>
        <a href="login.html" style="color:#f43f5e; text-decoration:none; margin-top:auto; font-size:14px;">Chiqish</a>
    </div>

    <div class="main-content">
        <div id="tab-dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card"><p class="stat-label">Foydalanuvchilar</p><p id="s-users" class="stat-value">...</p></div>
                <div class="stat-card"><p class="stat-label">Sessiyalar</p><p id="s-tests" class="stat-value">...</p></div>
                <div class="stat-card"><p class="stat-label">Avg Score</p><p id="s-band" class="stat-value">...</p></div>
                <div class="stat-card"><p class="stat-label">Status</p><p class="stat-value" style="color:#10b981">Online</p></div>
            </div>
            <div class="card"><canvas id="activityChart" height="80"></canvas></div>
        </div>

        <div id="tab-users" class="tab-content">
            <div class="card">
                <h3>CRM - Foydalanuvchilar</h3>
                <table style="margin-top:20px">
                    <thead><tr><th>Ism</th><th>Username</th><th>Level</th><th>Streak</th></tr></thead>
                    <tbody id="user-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-topics" class="tab-content">
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
                <div class="card"><h3>Mavjud Topiklar</h3><div id="topic-list" style="margin-top:15px"></div></div>
                <div class="card">
                    <h3>Yangi qo'shish</h3>
                    <input type="text" id="t-name" placeholder="Mavzu nomi">
                    <select id="t-part"><option value="1">Part 1</option><option value="2">Part 2</option><option value="3">Part 3</option></select>
                    <button class="btn" style="width:100%" onclick="addTopic()">Qo'shish</button>
                </div>
            </div>
        </div>

        <div id="tab-broadcast" class="tab-content">
            <div class="card" style="max-width:600px">
                <h3>Xabar yuborish</h3>
                <textarea id="msg-text" rows="8" placeholder="Xabar matni..."></textarea>
                <button class="btn" style="width:100%" onclick="sendBroadcast()">Yuborish</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://web-production-69ee71.up.railway.app';
        let allUsers = [];

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/stats`, { credentials: 'include' });
                if (res.status === 401) { window.location.href = 'login.html'; return; }
                const data = await res.json();
                document.getElementById('s-users').innerText = data.total_users;
                document.getElementById('s-tests').innerText = data.total_tests;
                document.getElementById('s-band').innerText = (data.avg_band || 0).toFixed(1);
                allUsers = data.recent_users;
                renderUsers(allUsers);
                renderChart(data.daily_activity);
                fetchTopics();
                document.getElementById('loader').classList.add('hidden');
            } catch (e) { console.error(e); }
        }

        function renderUsers(users) {
            document.getElementById('user-table-body').innerHTML = users.map(u => `
                <tr><td>${u.full_name}</td><td>@${u.username||'-'}</td><td>${u.level||'B1'}</td><td>🔥 ${u.streak||0}</td></tr>
            `).join('');
        }

        async function fetchTopics() {
            const res = await fetch(`${API_BASE}/api/admin/topics`, { credentials: 'include' });
            const data = await res.json();
            document.getElementById('topic-list').innerHTML = data.map(t => `
                <div style="padding:10px; border-bottom:1px solid var(--border)">${t.topic} (P${t.part})</div>
            `).join('');
        }

        async function addTopic() {
            const topic = document.getElementById('t-name').value;
            const part = document.getElementById('t-part').value;
            await fetch(`${API_BASE}/api/admin/topics`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({topic, part: parseInt(part)}), credentials: 'include'
            });
            alert("Qo'shildi"); fetchTopics();
        }

        async function sendBroadcast() {
            const text = document.getElementById('msg-text').value;
            const res = await fetch(`${API_BASE}/api/admin/broadcast`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({text}), credentials: 'include'
            });
            const d = await res.json(); alert("Yuborildi: " + d.count);
        }

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            el.classList.add('active');
        }

        function renderChart(data) {
            new Chart(document.getElementById('activityChart'), {
                type: 'line', data: {
                    labels: data.map(d=>d.date),
                    datasets: [{ label: 'Sessiyalar', data: data.map(d=>d.count), borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99,102,241,0.1)' }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }
        init();
    </script>
</body>
</html>
